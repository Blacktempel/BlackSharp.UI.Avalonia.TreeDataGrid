name: Build master

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_build_artifacts:
        description: Upload the NuGet package and compiled libraries
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      upload_build_artifacts:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      Solution_Name: BlackSharp.UI.Avalonia.TreeDataGrid.sln
      Package_Project: src/BlackSharp.UI.Avalonia.TreeDataGrid/BlackSharp.UI.Avalonia.TreeDataGrid.csproj
      TEST_FRAMEWORKS: net8.0 net10.0 net11.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x
          check-latest: false
          skip-lts-prepass: true

      - name: Install missing .NET test runtimes
        shell: bash
        run: |
          set -euo pipefail
          runtimes=$(dotnet --list-runtimes)
          extension=sh
          if [[ "$RUNNER_OS" == 'Windows' ]]; then extension=ps1; fi
          installer="$RUNNER_TEMP/dotnet-install-test-runtime.$extension"

          # Install the runtime for each test target that the active dotnet host cannot find.
          for framework in $TEST_FRAMEWORKS; do
            channel=${framework#net}
            pattern="^Microsoft\.NETCore\.App ${channel%.*}\.${channel#*.}\.[0-9]+ "
            if grep -Eq "$pattern" <<< "$runtimes"; then
              continue
            fi
            if [[ ! -f "$installer" ]]; then
              curl -fsSL --retry 3 "https://raw.githubusercontent.com/dotnet/install-scripts/da3ce11ba63f3dbb0fb835d41bda2665d5c48e84/src/dotnet-install.$extension" -o "$installer"
            fi
            if [[ "$extension" == 'ps1' ]]; then
              pwsh -NoProfile -NonInteractive -File "$installer" -Runtime dotnet -Channel "$channel" -InstallDir "$DOTNET_ROOT" -NoPath -SkipNonVersionedFiles
            else
              bash "$installer" --runtime dotnet --channel "$channel" --install-dir "$DOTNET_ROOT" --no-path --skip-non-versioned-files
            fi
            runtimes=$(dotnet --list-runtimes)
            if ! grep -Eq "$pattern" <<< "$runtimes"; then
              echo "::error::The active dotnet host cannot find the .NET $channel runtime."
              exit 1
            fi
          done

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/nuget.config', '**/NuGet.config', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Validate package version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet msbuild $env:Package_Project -nologo -t:ValidateTreeDataGridVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -LiteralPath Versions/TREEDATAGRID.VERSION -Raw).Trim()

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ${{ env.Solution_Name }}

      - name: Build Release
        id: build
        run: dotnet build ${{ env.Solution_Name }} --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --project tests/BlackSharp.UI.Avalonia.TreeDataGrid.Tests/BlackSharp.UI.Avalonia.TreeDataGrid.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run rendering tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/BlackSharp.UI.Avalonia.TreeDataGrid.RenderingTests/BlackSharp.UI.Avalonia.TreeDataGrid.RenderingTests.csproj --configuration Release --no-build --no-restore

      - name: Pack NuGet package
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet pack $env:Package_Project --configuration Release --no-build --no-restore --output "$env:RUNNER_TEMP/TreeDataGrid-NuGet"

      - name: Verify NuGet package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/TreeDataGrid-NuGet" -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one NuGet package, found $($packages.Count)." }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
            if ($specifications.Count -ne 1) { throw 'Expected one NuGet specification.' }

            $reader = [System.IO.StreamReader]::new($specifications[0].Open())
            try { [xml]$specification = $reader.ReadToEnd() }
            finally { $reader.Dispose() }

            if ([string]$specification.package.metadata.id -cne 'BlackSharp.UI.Avalonia.TreeDataGrid' -or
                [string]$specification.package.metadata.version -cne $env:PACKAGE_VERSION) {
              throw "Unexpected package identity or version in $($packages[0].Name)."
            }

            foreach ($framework in @('net8.0', 'net10.0', 'net11.0')) {
              $library = "lib/$framework/BlackSharp.UI.Avalonia.TreeDataGrid.dll"
              if ($library -cnotin $archive.Entries.FullName) { throw "Missing $library in the NuGet package." }
            }
          }
          finally { $archive.Dispose() }

      - name: Upload NuGet package
        if: ${{ runner.os == 'Windows' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.upload_build_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TreeDataGrid-NuGet-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/TreeDataGrid-NuGet/*.nupkg
          if-no-files-found: error

      - name: Upload compiled libraries
        if: ${{ runner.os == 'Windows' && github.event_name != 'push' && github.event_name != 'pull_request' && inputs.upload_build_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TreeDataGrid-Libraries-${{ steps.version.outputs.version }}
          path: |
            src/BlackSharp.UI.Avalonia.TreeDataGrid/bin/Release/net8.0/
            src/BlackSharp.UI.Avalonia.TreeDataGrid/bin/Release/net10.0/
            src/BlackSharp.UI.Avalonia.TreeDataGrid/bin/Release/net11.0/
          if-no-files-found: error
