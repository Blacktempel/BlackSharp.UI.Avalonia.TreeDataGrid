name: Close inactive issues and pull requests

on:
  schedule:
    - cron: '0 0 3-30/3 * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 45
          days-before-close: 14
          remove-stale-when-updated: true

          stale-issue-label: 'stale'
          exempt-issue-labels: 'keep-open'
          stale-issue-message: |
            This issue has been inactive for 45 days.
            It will be closed in 14 days unless there is further activity.
          close-issue-message: |
            This issue was automatically closed due to inactivity.

          stale-pr-label: 'stale'
          exempt-pr-labels: 'keep-open'
          stale-pr-message: |
            This pull request has been inactive for 45 days.
            It will be closed in 14 days unless there is further activity.
          close-pr-message: |
            This pull request was automatically closed due to inactivity.
