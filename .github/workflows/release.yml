name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional release title (defaults to the tag)
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PACKAGE_PROJECT: src/BlackSharp.UI.Avalonia.TreeDataGrid/BlackSharp.UI.Avalonia.TreeDataGrid.csproj
  PACKAGE_ID: BlackSharp.UI.Avalonia.TreeDataGrid

jobs:
  validate_release_inputs:
    name: Validate release inputs
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read package version and validate release tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet msbuild $env:PACKAGE_PROJECT -nologo -t:ValidateTreeDataGridVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -LiteralPath Versions/TREEDATAGRID.VERSION -Raw).Trim()

          $tagName = $version
          git check-ref-format "refs/tags/$tagName"
          if ($LASTEXITCODE -ne 0) { throw "The generated Git tag is invalid: $tagName" }

          $remoteTag = @(git ls-remote --tags origin "refs/tags/$tagName")
          if ($LASTEXITCODE -ne 0) { throw 'The existing Git tags could not be checked.' }
          if ($remoteTag.Count -gt 0) { throw "The Git tag already exists: $tagName" }

          $releaseTags = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'The existing releases and drafts could not be checked.' }
          if ($tagName -cin $releaseTags) { throw "A release or draft already exists for $tagName." }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT

  build_packages:
    name: Build and test release package
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate_release_inputs
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      upload_build_artifacts: true

  create_draft_release:
    name: Create draft GitHub release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - validate_release_inputs
      - build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download NuGet package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TreeDataGrid-NuGet-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/NuGet

      - name: Download compiled libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TreeDataGrid-Libraries-${{ needs.validate_release_inputs.outputs.version }}
          path: staging/Libraries

      - name: Validate and archive release assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate_release_inputs.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath 'staging/NuGet' -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one NuGet package, found $($packages.Count)." }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
            if ($specifications.Count -ne 1) { throw 'Expected one NuGet specification.' }

            $reader = [System.IO.StreamReader]::new($specifications[0].Open())
            try { [xml]$specification = $reader.ReadToEnd() }
            finally { $reader.Dispose() }

            if ([string]$specification.package.metadata.id -cne $env:PACKAGE_ID -or
                [string]$specification.package.metadata.version -cne $env:PACKAGE_VERSION) {
              throw "Unexpected package identity or version in $($packages[0].Name)."
            }
          }
          finally { $archive.Dispose() }

          $libraries = @(Get-ChildItem -LiteralPath 'staging/Libraries' -Recurse -Filter "$env:PACKAGE_ID.dll" -File)
          if ($libraries.Count -ne 2) { throw "Expected libraries for two target frameworks, found $($libraries.Count)." }

          $releaseDirectory = (New-Item -ItemType Directory -Path release-assets -Force).FullName
          foreach ($component in @('NuGet', 'Libraries')) {
            $source = (Resolve-Path -LiteralPath "staging/$component").Path
            $destination = Join-Path $releaseDirectory "$env:PACKAGE_ID-$component-$env:PACKAGE_VERSION.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $destination, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          }

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate_release_inputs.outputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $title = $env:RELEASE_NAME
          if ([string]::IsNullOrWhiteSpace($title)) { $title = $env:RELEASE_TAG }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--target', $env:GITHUB_SHA,
            '--title', $title,
            '--draft',
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          $arguments += @(Get-ChildItem -LiteralPath release-assets -Filter '*.zip' -File | Sort-Object Name | ForEach-Object { $_.FullName })

          $releaseUrl = gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'The draft release could not be created.' }

          @(
            '### Draft release created'
            ''
            "[$env:RELEASE_TAG]($releaseUrl) is ready for review."
            'The NuGet package will be published only after this draft is published.'
          ) >> $env:GITHUB_STEP_SUMMARY

  publish_nuget:
    name: Publish NuGet package
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !github.event.release.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate NuGet publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
            throw 'The NUGET_USER repository variable must contain the nuget.org username.'
          }

      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate released version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet msbuild $env:PACKAGE_PROJECT -nologo -t:ValidateTreeDataGridVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content -LiteralPath Versions/TREEDATAGRID.VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -cne $version) {
            throw "Release tag '$env:RELEASE_TAG' does not match the package version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download and extract release NuGet package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archiveName = "$env:PACKAGE_ID-NuGet-$env:PACKAGE_VERSION.zip"
          gh release download $env:RELEASE_TAG --pattern $archiveName --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'The release NuGet archive could not be downloaded.' }
          Expand-Archive -LiteralPath "dist/$archiveName" -DestinationPath dist/packages

      - name: Log in to NuGet using Trusted Publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify and publish NuGet package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet Trusted Publishing did not return a temporary API key.'
          }

          $packages = @(Get-ChildItem -LiteralPath 'dist/packages/NuGet' -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one NuGet package, found $($packages.Count)." }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $specifications = @($archive.Entries | Where-Object { $_.FullName.EndsWith('.nuspec') })
            if ($specifications.Count -ne 1) { throw 'Expected one NuGet specification.' }

            $reader = [System.IO.StreamReader]::new($specifications[0].Open())
            try { [xml]$specification = $reader.ReadToEnd() }
            finally { $reader.Dispose() }

            if ([string]$specification.package.metadata.id -cne $env:PACKAGE_ID -or
                [string]$specification.package.metadata.version -cne $env:PACKAGE_VERSION) {
              throw "Unexpected package identity or version in $($packages[0].Name)."
            }
          }
          finally { $archive.Dispose() }

          dotnet nuget push $packages[0].FullName `
            --api-key $env:NUGET_API_KEY `
            --source 'https://api.nuget.org/v3/index.json' `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $($packages[0].Name)." }
